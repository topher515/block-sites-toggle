<html>
  <head>
    <meta charset="utf-8">
    <title>Blocker</title>
    <style>
      body { font: 14px -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif; margin: 0; padding: 14px 16px; min-width: 220px; }

      button { padding: 8px 12px; border: 0; border-radius: 10px; cursor: pointer; }

  <body>
    <div class="status">Sections</div>
    <div>
      <button id="toggle-life" class="on">Life Improvement: ON</button>
    </div>
    <div style="margin-top:8px;">
      <button id="toggle-work" class="on">Work Focus: ON</button>
    </div>
    <small>Life Improvement: reddit.com</small>
    <small>Work Focus: news.ycombinator.com, youtube.com</small>
    <script src="popup.js"></script>
  </body>
 </html>
